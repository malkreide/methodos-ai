<!doctype html>
<!--
  Test console for the Methodos HTTP API.

  Deliberately one self-contained file with no build step and no external
  requests: it ships inside the Python package, is served from `/`, and has to
  work in a container with no egress. Everything it does is a fetch against an
  endpoint documented at /docs — it holds no logic of its own about ranking,
  and the raw JSON stays one click away so the page can never be mistaken for
  the API's actual contract.

  Two languages, German and English, chosen by `?lang=`, then the viewer's
  last choice, then the browser. Only the page's own words are translated:
  method names and descriptions are catalog data and stay as written, and
  messages from the server (`detail`, `guidance`) arrive in English. Every
  key used below must exist in both dictionaries — test_api.py checks it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Methodos AI</title>
<style>
  :root {
    --bg: #fbfaf8; --fg: #1c1b19; --muted: #6b6a66; --line: #e2dfd9;
    --card: #ffffff; --accent: #7a5c3e; --bad: #a3341f; --good: #3d6b45;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --fg: #ece9e4; --muted: #9c9890; --line: #2f2d29;
      --card: #1f1e1b; --accent: #c69b6d; --bad: #e0866f; --good: #86b28f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.25rem 4rem; background: var(--bg); color: var(--fg);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 52rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: .9rem; }
  .sub a { color: var(--accent); }
  fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 1rem; margin: 0 0 1rem; background: var(--card); }
  legend { padding: 0 .4rem; color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; }
  textarea, input, select {
    width: 100%; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--fg); font: inherit;
  }
  textarea { min-height: 4.5rem; resize: vertical; }
  .row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: end; margin-top: .75rem; }
  .row > label { flex: 1 1 8rem; font-size: .8rem; color: var(--muted); }
  .checks { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-top: .75rem; font-size: .85rem; }
  .checks label { display: flex; gap: .4rem; align-items: center; color: var(--fg); }
  .checks input { width: auto; }
  button {
    padding: .6rem 1.1rem; border: 1px solid var(--accent); border-radius: 7px;
    background: var(--accent); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent); font-weight: 500; }
  button:disabled { opacity: .55; cursor: progress; }
  #status { font-size: .82rem; color: var(--muted); margin: 0 0 1.25rem; }
  #status .warn { color: var(--bad); }
  .card { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px;
          padding: .85rem 1rem; margin: 0 0 .75rem; background: var(--card); }
  .card h3 { margin: 0 0 .2rem; font-size: 1rem; }
  .meta { color: var(--muted); font-size: .8rem; margin-bottom: .5rem; }
  .meta code { background: transparent; }
  ul { margin: .3rem 0; padding-left: 1.1rem; }
  .rate { display: flex; gap: .35rem; align-items: center; margin-top: .6rem; font-size: .8rem; color: var(--muted); }
  .rate button { padding: .15rem .5rem; font-size: .8rem; font-weight: 500; background: transparent; color: var(--accent); }
  .privacy { color: var(--muted); font-size: .8rem; margin: .4rem 0 0; }
  .note { border: 1px solid var(--line); border-radius: 8px; padding: .85rem 1rem; background: var(--card); }
  .note.err { border-color: var(--bad); color: var(--bad); }
  .note.warn { border-color: var(--accent); }
  pre { overflow-x: auto; background: var(--card); border: 1px solid var(--line);
        border-radius: 8px; padding: .8rem; font-size: .8rem; }
  details { margin-top: 1rem; }
  summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
  nav { display: flex; gap: .4rem; margin: 0 0 1.25rem; }
  nav button { background: transparent; color: var(--accent); font-weight: 500; }
  nav button[aria-selected="true"] { background: var(--accent); color: var(--bg); font-weight: 600; }
  .field { display: block; font-size: .8rem; color: var(--muted); margin-top: .75rem; }
  #pout a { color: var(--accent); }
  .field textarea, .field input, .field select { margin-top: .25rem; color: var(--fg); }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .lang { display: flex; gap: .25rem; }
  .lang button { padding: .15rem .5rem; font-size: .75rem; font-weight: 500; background: transparent; color: var(--accent); }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  #ffile input[type=file] { padding: .4rem; }
  #fout { margin: 0 0 1rem; }
  #fout .note + .note, #fout .note + details { margin-top: .6rem; }
  #fout pre { white-space: pre-wrap; max-height: 22rem; overflow-y: auto; }
  .orig { color: var(--muted); font-size: .8rem; margin-top: .4rem; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 1.75rem 0 .6rem; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Methodos AI</h1>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button type="button" data-lang="de" aria-pressed="false">DE</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <p class="sub"><span data-i18n="tagline"></span> &middot;
    <a href="/docs">OpenAPI</a> &middot; <a href="/methods" data-i18n="catalog"></a></p>

  <p id="status" data-i18n="checking"></p>

  <nav role="tablist">
    <button type="button" role="tab" data-tab="ask" aria-selected="true" data-i18n="tab_ask"></button>
    <button type="button" role="tab" data-tab="propose" aria-selected="false" data-i18n="tab_propose"></button>
  </nav>

  <section id="tab-ask">
  <form id="form">
    <fieldset>
      <legend data-i18n="problem"></legend>
      <textarea id="problem" required minlength="3" data-i18n-placeholder="problem_ph"></textarea>
      <p class="privacy" id="privacy" data-i18n-html="privacy_ask"></p>
      <div class="row">
        <label><span data-i18n="results"></span>
          <input type="number" id="top_k" value="3" min="1" max="25">
        </label>
        <label><span data-i18n="category"></span>
          <select id="category"><option value="" data-i18n="all"></option></select>
        </label>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="explain" checked> <span data-i18n="explain"></span></label>
        <label><input type="checkbox" id="rerank" checked> <span data-i18n="rerank"></span></label>
        <button type="submit" id="go" data-i18n="ask"></button>
        <button type="button" class="ghost" id="llmcheck" data-i18n="llmcheck"></button>
      </div>
    </fieldset>
  </form>

  <div id="out"></div>
  </section>

  <!--
    Proposals mirror the GitHub "Propose a method" issue form field for field.
    Nothing here publishes anything: the server stores the proposal and may hand
    back a prefilled issue link; the catalog only changes through a reviewed PR.
  -->
  <section id="tab-propose" hidden>
  <!--
    Optional first step: read a file and prefill the form below from it. The
    file goes to /proposals/extract and is deleted there; what comes back only
    fills fields the person then edits and submits like any other proposal.
  -->
  <fieldset id="ffile">
    <legend data-i18n="f_legend"></legend>
    <p class="sub" data-i18n="f_intro"></p>
    <input type="file" id="f_file">
    <div class="checks">
      <label><input type="checkbox" id="f_draft" checked> <span data-i18n="f_draft"></span></label>
      <button type="button" id="f_go" data-i18n="f_go"></button>
    </div>
    <p class="privacy" data-i18n-html="privacy_file"></p>
    <p class="privacy" id="f_limits"></p>
  </fieldset>
  <div id="fout"></div>

  <form id="pform">
    <fieldset>
      <legend data-i18n="tab_propose"></legend>
      <label class="field"><span data-i18n="p_name"></span>
        <input id="p_name" required minlength="2" maxlength="120" data-i18n-placeholder="p_name_ph">
      </label>
      <label class="field"><span data-i18n="p_existing"></span>
        <select id="p_existing"><option value="" data-i18n="p_existing_no"></option></select>
      </label>
      <label class="field"><span data-i18n="p_problem"></span>
        <textarea id="p_problem" required minlength="20" maxlength="2000" data-i18n-placeholder="p_problem_ph"></textarea>
      </label>
      <label class="field"><span data-i18n-html="p_description"></span>
        <textarea id="p_description" maxlength="3000" data-i18n-placeholder="p_description_ph"></textarea>
      </label>
      <label class="field"><span data-i18n="p_sources"></span>
        <textarea id="p_sources" maxlength="1000" data-i18n-placeholder="p_sources_ph"></textarea>
      </label>
      <label class="field"><span data-i18n-html="p_links"></span>
        <textarea id="p_links"></textarea>
      </label>
      <div class="field"><span data-i18n="p_contexts"></span>
        <div class="checks" id="p_contexts"></div>
      </div>
      <p class="privacy" data-i18n-html="privacy_propose"></p>
      <div class="checks"><button type="submit" id="pgo" data-i18n="p_submit"></button></div>
    </fieldset>
  </form>
  <div id="pout"></div>
  </section>
</main>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function pickLang() {
  const asked = new URLSearchParams(location.search).get('lang');
  if (asked in I18N) return asked;
  try {
    const saved = localStorage.getItem('methodos.lang');
    if (saved in I18N) return saved;
  } catch { /* storage blocked: fall through to the browser */ }
  return (navigator.languages || [navigator.language || 'en'])
    .some((l) => String(l).toLowerCase().startsWith('de')) ? 'de' : 'en';
}
let lang = pickLang();

// Values are trusted markup from I18N; anything from the server goes through esc()
// before it is passed in as a variable.
function t(key, vars = {}) {
  const s = I18N[lang][key] ?? I18N.en[key] ?? key;
  return s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '');
}
// Labels for enum values the server sends: fall back to the raw value, so a
// category added to the catalog shows up untranslated rather than not at all.
const label = (prefix, value) => I18N[lang][`${prefix}_${value}`] ?? value;

let lastQueryId = null;
let lastQuery = null;
let lastProposal = null;
let lastHealth = null;
let lastExtract = null;
let extractedFrom = null;

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    // FastAPI's 422 carries a list of {loc, msg}; everything else a string.
    const detail = Array.isArray(body.detail)
      ? body.detail.map((d) => d.msg.replace(/^Value error, /, '')).join('; ')
      : body.detail;
    throw new Error(detail || `${res.status} ${res.statusText}`);
  }
  return body;
}

function applyLang() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll('[data-i18n-html]')) el.innerHTML = t(el.dataset.i18nHtml);
  for (const el of document.querySelectorAll('[data-i18n-placeholder]')) el.placeholder = t(el.dataset.i18nPlaceholder);
  for (const b of document.querySelectorAll('.lang button')) {
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
  }
  for (const o of $('category').options) if (o.value) o.textContent = label('cat', o.value);
  for (const o of $('p_existing').options) {
    if (o.value) o.textContent = t('p_existing_yes', { name: o.dataset.name });
  }
  for (const s of document.querySelectorAll('#p_contexts span')) s.textContent = label('ctx', s.dataset.ctx);
  // Re-render what is on screen rather than leave it in the old language.
  if (lastHealth) renderStatus(lastHealth);
  if (lastQuery) render(lastQuery);
  if (lastProposal) renderProposal(lastProposal);
  if (lastHealth) renderUploadLimits(lastHealth);
  if (lastExtract) renderExtract(lastExtract);
}

for (const b of document.querySelectorAll('.lang button')) {
  b.addEventListener('click', () => {
    lang = b.dataset.lang;
    try { localStorage.setItem('methodos.lang', lang); } catch { /* per-visit only */ }
    applyLang();
  });
}

function renderStatus(h) {
  const bits = [
    `v${esc(h.version)}`,
    `${t('st_model')} <b>${esc(h.model)}</b>`,
    `${t('st_embedding')} ${esc(h.embedding)}`,
    `${t('st_rerank')} ${h.reranker ? esc(h.reranker) : t('st_off')}`,
    h.index_error ? `<span class="warn">${t('st_index')}: ${esc(h.index_error)}</span>`
                  : t('st_indexed', { n: h.indexed_methods }),
  ];
  $('status').innerHTML = bits.join(' &middot; ');
}

async function refreshStatus() {
  try {
    lastHealth = await api('/health');
    renderStatus(lastHealth);
    renderUploadLimits(lastHealth);
  } catch (e) {
    $('status').innerHTML = `<span class="warn">${t('st_failed')}: ${esc(e.message)}</span>`;
  }
}

async function loadCategories() {
  try {
    const c = await api('/methods');
    for (const name of c.categories) {
      const o = document.createElement('option');
      o.value = name;
      o.textContent = label('cat', name);
      $('category').appendChild(o);
    }
  } catch { /* the form still works without the filter */ }
}

function renderMatch(m, i) {
  const dots = '&#9679;'.repeat(m.complexity_score) + '&#9675;'.repeat(5 - m.complexity_score);
  const score = m.rerank_score === null || m.rerank_score === undefined
    ? `sim ${m.similarity.toFixed(3)}`
    : `sim ${m.similarity.toFixed(3)} &middot; rerank ${m.rerank_score >= 0 ? '+' : ''}${m.rerank_score.toFixed(2)}`;
  return `<div class="card">
    <h3>#${i + 1} ${esc(m.name)}</h3>
    <div class="meta">${score} &middot; ${t('complexity')} ${dots} &middot; ${esc(label('cat', m.category))}
      &middot; ${m.duration_min}&ndash;${m.duration_max} min &middot; <code>${esc(m.id)}</code></div>
    <div>${esc(m.use_case)}</div>
    ${m.matched_use_case ? `<div class="meta">${t('matched')}: ${esc(m.matched_use_case)}</div>` : ''}
    <ul>${m.strengths.slice(0, 3).map((s) => `<li>${esc(s)}</li>`).join('')}</ul>
    <div class="rate" data-id="${esc(m.id)}">${t('helped')}
      ${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-rating="${n}">${n}</button>`).join('')}
    </div>
  </div>`;
}

function renderGuidance(data) {
  // The server's guidance is written for a model that calls the MCP tools; a
  // translation states the same finding for a person and keeps the original.
  if (!I18N[lang].guidance_none) return `<div class="note warn">${esc(data.guidance)}</div>`;
  const own = t(data.returned === 0 ? 'guidance_none' : 'guidance_weak');
  return `<div class="note warn">${esc(own)}<div class="orig">${esc(data.guidance)}</div></div>`;
}

function render(data) {
  const parts = [];

  if (data.guidance) parts.push(renderGuidance(data));

  parts.push(`<h2>${t('summary', {
    returned: data.returned, scope: data.total_in_scope, indexed: data.total_indexed,
    basis: t(data.ranking_basis === 'cross-encoder' ? 'basis_cross' : 'basis_embed'),
  })}</h2>`);
  parts.push(data.matches.map(renderMatch).join(''));

  if (data.explanation_error) {
    parts.push(`<h2>${t('explanation')}</h2><div class="note err">
      ${t('explain_failed')}<br>${esc(data.explanation_error)}</div>`);
  } else if (data.explanation) {
    parts.push(`<h2>${t('explanation')} &middot; ${esc(data.explanation_model || '')}</h2>
      <div class="note">${esc(data.explanation).replace(/\n/g, '<br>')}</div>`);
  }

  parts.push(`<details><summary>${t('raw')}</summary><pre>${esc(JSON.stringify(data, null, 2))}</pre></details>`);
  $('out').innerHTML = parts.join('');
}

$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  $('go').disabled = true;
  lastQuery = null;
  $('out').innerHTML = `<p class="sub">${t('thinking')}</p>`;
  try {
    const data = await api('/query', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        problem: $('problem').value,
        top_k: Number($('top_k').value),
        category: $('category').value || null,
        explain: $('explain').checked,
        rerank: $('rerank').checked,
      }),
    });
    lastQueryId = data.query_id;
    lastQuery = data;
    render(data);
  } catch (e) {
    $('out').innerHTML = `<div class="note err">${esc(e.message)}</div>`;
  } finally {
    $('go').disabled = false;
  }
});

$('llmcheck').addEventListener('click', async () => {
  $('llmcheck').disabled = true;
  lastQuery = null;
  $('out').innerHTML = `<p class="sub">${t('calling')}</p>`;
  try {
    const r = await api('/llm/check', { method: 'POST' });
    $('out').innerHTML = `<div class="note">${t('llm_ok', {
      model: esc(r.model), reply: esc(r.reply), ms: r.latency_ms,
    })}</div>`;
  } catch (e) {
    $('out').innerHTML = `<div class="note err">${esc(e.message)}</div>`;
  } finally {
    $('llmcheck').disabled = false;
  }
});

// One delegated listener: the rating buttons are re-created on every query.
$('out').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button[data-rating]');
  if (!btn) return;
  const row = btn.closest('.rate');
  try {
    await api('/feedback', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        method_id: row.dataset.id,
        rating: Number(btn.dataset.rating),
        query_id: lastQueryId,
      }),
    });
    row.innerHTML = t('recorded', { n: esc(btn.dataset.rating) });
  } catch (e) {
    row.innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`;
  }
});

function showTab(name) {
  for (const b of document.querySelectorAll('nav button')) {
    b.setAttribute('aria-selected', String(b.dataset.tab === name));
  }
  $('tab-ask').hidden = name !== 'ask';
  $('tab-propose').hidden = name !== 'propose';
}
for (const b of document.querySelectorAll('nav button')) {
  b.addEventListener('click', () => showTab(b.dataset.tab));
}

async function loadProposalOptions() {
  try {
    const c = await api('/methods');
    for (const m of c.methods) {
      const o = document.createElement('option');
      o.value = m.id;
      o.dataset.name = m.name;
      o.textContent = t('p_existing_yes', { name: m.name });
      $('p_existing').appendChild(o);
    }
  } catch { /* "new method" still works */ }
  try {
    // Read off the API's own schema so the page never carries its own copy of the list.
    const spec = await api('/openapi.json');
    for (const ctx of spec.components.schemas.Context.enum) {
      $('p_contexts').insertAdjacentHTML('beforeend',
        `<label><input type="checkbox" value="${esc(ctx)}"> <span data-ctx="${esc(ctx)}">${esc(label('ctx', ctx))}</span></label>`);
    }
  } catch { /* contexts are optional */ }
}

function renderProposal(r) {
  const parts = [`<div class="note">${t('p_thanks', { id: esc(r.proposal_id) })}</div>`];

  if (r.similar_error) {
    parts.push(`<div class="note warn">${t('p_dup_failed')} ${esc(r.similar_error)}</div>`);
  } else if (r.similar.length) {
    parts.push(`<h2>${t('p_similar')}</h2><p class="sub">${t('p_similar_hint')}</p>`);
    parts.push(r.similar.map((m) => `<div class="card"><h3>${esc(m.name)}</h3>
      <div class="meta">${esc(label('cat', m.category))} &middot; <code>${esc(m.id)}</code></div>
      <div>${esc(m.matched_use_case || m.use_case)}</div></div>`).join(''));
  }

  if (r.issue_url) {
    const omitted = r.issue_url_omitted.length
      ? `<br>${t('p_omitted')} ${r.issue_url_omitted.map((f) => esc(t(`f_${f}`))).join(', ')}.`
      : '';
    parts.push(`<h2>${t('p_github')}</h2><div class="note">
      <a href="${esc(r.issue_url)}" target="_blank" rel="noopener">${t('p_github_link')}</a>
      ${t('p_github_text')}${omitted}</div>`);
  }
  $('pout').innerHTML = parts.join('');
}

$('pform').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const opt = (id) => $(id).value.trim() || null;
  const links = $('p_links').value.split('\n').map((l) => l.trim()).filter(Boolean);
  // The server enforces both as well; checking here says it in the viewer's language.
  const problem = !opt('p_sources') && !links.length ? 'p_need_source'
    : links.length > 5 ? 'p_too_many_links' : null;
  if (problem) {
    lastProposal = null;
    $('pout').innerHTML = `<div class="note err">${t(problem)}</div>`;
    return;
  }
  $('pgo').disabled = true;
  lastProposal = null;
  $('pout').innerHTML = `<p class="sub">${t('p_checking')}</p>`;
  try {
    const r = await api('/proposals', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        name: $('p_name').value.trim(),
        problem: $('p_problem').value.trim(),
        description: opt('p_description'),
        sources: opt('p_sources'),
        links,
        contexts: [...document.querySelectorAll('#p_contexts input:checked')].map((i) => i.value),
        existing_method_id: $('p_existing').value || null,
        extracted_from: extractedFrom,
      }),
    });
    lastProposal = r;
    renderProposal(r);
    $('pform').reset();
    $('f_file').value = '';
    $('fout').innerHTML = '';
    lastExtract = null;
    extractedFrom = null;
  } catch (e) {
    $('pout').innerHTML = `<div class="note err">${esc(e.message)}</div>`;
  } finally {
    $('pgo').disabled = false;
  }
});

applyLang();
// --- start from a file ------------------------------------------------------

const MEDIA = /\.(mp3|m4a|wav|ogg|oga|opus|flac|aac|mp4|m4v|mov|webm|mkv|avi)$/i;

function renderUploadLimits(h) {
  $('f_file').accept = h.upload_suffixes.join(',');
  const media = h.upload_suffixes.some((x) => MEDIA.test(x));
  $('f_limits').textContent = t('f_limits', {
    mb: h.upload_max_mb, min: h.media_max_minutes, types: h.upload_suffixes.join(' '),
  }) + (media ? '' : ' · ' + t('f_no_media'));
}

const minutes = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;

function renderExtract(r) {
  const parts = [];
  if (r.draft) {
    parts.push(`<div class="note">${t('f_filled')}</div>`);
    if (!r.draft.is_method) parts.push(`<div class="note warn">${t('f_not_method')}</div>`);
    if (r.draft.note) parts.push(`<div class="note warn">${t('f_note')} ${esc(r.draft.note)}</div>`);
  } else if (r.draft_error) {
    parts.push(`<div class="note err">${t('f_draft_failed')}<div class="orig">${esc(r.draft_error)}</div></div>`);
  } else {
    parts.push(`<div class="note">${t('f_no_draft')}</div>`);
  }
  const label = r.duration_seconds
    ? t('f_text_media', { n: r.characters, dur: minutes(r.duration_seconds) })
    : t('f_text', { n: r.characters });
  parts.push(`<details ${r.draft ? '' : 'open'}><summary>${label}</summary>
    ${r.text_truncated ? `<p class="sub">${t('f_truncated')}</p>` : ''}
    <pre>${esc(r.text)}</pre></details>`);
  $('fout').innerHTML = parts.join('');
}

function fillFromDraft(d) {
  const set = (id, v) => { if (v) $(id).value = v; };
  set('p_name', d.name);
  set('p_problem', d.problem);
  set('p_description', d.description);
  set('p_sources', d.sources);
  if (d.contexts.length) {
    for (const box of document.querySelectorAll('#p_contexts input')) {
      box.checked = d.contexts.includes(box.value);
    }
  }
}

$('f_go').addEventListener('click', async () => {
  const file = $('f_file').files[0];
  lastExtract = null;
  if (!file) { $('fout').innerHTML = `<div class="note err">${t('f_pick')}</div>`; return; }
  if (lastHealth && file.size > lastHealth.upload_max_mb * 1024 * 1024) {
    $('fout').innerHTML = `<div class="note err">${t('f_too_big', { mb: lastHealth.upload_max_mb })}</div>`;
    return;
  }
  const body = new FormData();
  body.append('file', file);
  body.append('draft', $('f_draft').checked ? 'true' : 'false');
  body.append('language', lang);
  $('f_go').disabled = true;
  $('fout').innerHTML = `<p class="sub">${t(MEDIA.test(file.name) ? 'f_transcribing' : 'f_reading')}</p>`;
  try {
    const r = await api('/proposals/extract', { method: 'POST', body });
    lastExtract = r;
    extractedFrom = r.kind;
    if (r.draft) fillFromDraft(r.draft);
    renderExtract(r);
  } catch (e) {
    $('fout').innerHTML = `<div class="note err">${esc(e.message)}</div>`;
  } finally {
    $('f_go').disabled = false;
  }
});

refreshStatus();
loadCategories();
loadProposalOptions();
</script>
</body>
</html>
