<!doctype html>
<!--
  The Methodos page — for the person who is stuck: describe the problem, pick a
  method with its reasons, then work through it step by step.

  Same rules as console.html: one self-contained file with no build step and no
  external requests, so it works in a container with no egress. It holds no
  ranking logic — it renders what /query and /methods/{id} return. Anything a
  developer needs (raw scores aside from the "Details" disclosure, the rerank
  toggle, the LLM check, raw JSON) lives in /console, not here.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Methodos</title>
<style>
  :root {
    --bg: #fbfaf8; --fg: #1c1b19; --muted: #6b6a66; --line: #e2dfd9; --soft: #f1ede7;
    --card: #ffffff; --accent: #7a5c3e; --accent-fg: #ffffff; --bad: #a3341f; --good: #3d6b45;
    --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --fg: #ece9e4; --muted: #9c9890; --line: #2f2d29; --soft: #24221f;
      --card: #1f1e1b; --accent: #c69b6d; --accent-fg: #171614; --bad: #e0866f; --good: #86b28f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem; background: var(--bg); color: var(--fg);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 64rem; margin: 0 auto; }
  [hidden] { display: none !important; }
  h1 { font-size: 1.6rem; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 1.15rem; margin: 0 0 .25rem; }
  .tag { color: var(--muted); margin: .2rem 0 1.5rem; }
  .label {
    font: 600 .72rem/1.4 var(--mono); text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 .5rem; display: block;
  }
  .label span { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; }
  section { margin: 0 0 1rem; }
  textarea {
    width: 100%; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--fg); font: inherit; resize: vertical;
  }
  #problem { min-height: 5rem; }
  #already-done { min-height: 2.6rem; }
  .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-top: .8rem; }
  button {
    padding: .55rem 1.05rem; border: 1px solid var(--accent); border-radius: 7px;
    background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent); font-weight: 500; }
  button.link { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 500; text-decoration: underline; }
  button:disabled { opacity: .55; cursor: progress; }
  .muted { color: var(--muted); }
  .note { border: 1px solid var(--accent); border-radius: 8px; padding: .75rem .9rem; background: var(--soft); }
  .note.err { border-color: var(--bad); color: var(--bad); background: transparent; }

  /* waiting state */
  .waiting { display: flex; gap: .8rem; align-items: center; color: var(--muted); }
  .pulse { width: 7rem; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; position: relative; }
  .pulse::after {
    content: ""; position: absolute; inset: 0; width: 40%; background: var(--accent); border-radius: 2px;
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { .pulse::after { animation: none; width: 100%; opacity: .4; } }

  /* ranking */
  .grid { display: grid; gap: 1rem; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .grid { grid-template-columns: 1.15fr 1fr; } }
  #ranking { list-style: none; margin: 0; padding: 0; }
  .rank {
    display: grid; grid-template-columns: 1.6rem 1fr; gap: .2rem .6rem; align-items: center;
    width: 100%; text-align: left; padding: .55rem .5rem; margin: 0 0 .25rem; border-radius: 7px;
    border: 1px solid transparent; background: transparent; color: var(--fg); font-weight: 400;
  }
  .rank:hover { background: var(--soft); }
  .rank.on { border-color: var(--accent); background: var(--soft); }
  .rank .n { font: 600 .85rem var(--mono); color: var(--muted); grid-row: span 2; }
  .rank .name { font-weight: 600; }
  .rank .fit { font-size: .78rem; color: var(--muted); margin-left: .4rem; font-weight: 400; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  details { margin-top: .6rem; font-size: .85rem; }
  summary { cursor: pointer; color: var(--muted); }
  .raw { font: .78rem/1.5 var(--mono); color: var(--muted); margin: .4rem 0 0; }
  #why { white-space: normal; }

  /* selected method */
  .use { margin: .2rem 0 .9rem; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin: 0 0 1rem; }
  .tile { border: 1px solid var(--line); border-radius: 8px; padding: .55rem .7rem; }
  .tile b { display: block; font: 600 1.25rem/1.3 var(--mono); }
  .tile small { color: var(--muted); }
  .cols { display: grid; gap: 1rem; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .cols { grid-template-columns: 1fr 1fr; } }
  ul { margin: .2rem 0; padding-left: 1.1rem; }
  li { margin: .15rem 0; }
  .rate { display: flex; gap: .35rem; align-items: center; flex-wrap: wrap; margin-top: 1rem; font-size: .9rem; }
  .rate button { padding: .2rem .6rem; font-weight: 500; background: transparent; color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Methodos</h1>
    <p class="tag">Stuck on a problem or a next step? Find a method that fits, see why, and work through it.</p>
  </header>

  <section class="card">
    <form id="form">
      <label class="label" for="problem">01 · Your problem</label>
      <textarea id="problem" required minlength="3"
        placeholder="Describe the situation or the decision, not a method. e.g. Tickets take six weeks end to end, but the actual work is only a few hours."></textarea>
      <label class="label" for="already-done" style="margin-top:.9rem">What you've already done <span>(optional)</span></label>
      <textarea id="already-done" maxlength="2000"
        placeholder="e.g. Ran a Five Whys last week; the delay comes from the approval step."></textarea>
      <div id="next-steps"></div>
      <div class="row"><button type="submit" id="go">Find methods</button></div>
    </form>
  </section>

  <section id="history" hidden></section>

  <section id="status" hidden></section>

  <section id="results" hidden>
    <div class="grid">
      <div class="card">
        <span class="label">02 · Methods that fit</span>
        <div id="guidance"></div>
        <ol id="ranking"></ol>
        <details><summary>Details</summary><div id="raw" class="raw"></div></details>
      </div>
      <div class="card" id="why-card">
        <span class="label">Why these methods?</span>
        <div id="why"></div>
      </div>
    </div>
    <div class="card" id="method" style="margin-top:1rem" hidden></div>
  </section>

  <section id="apply" hidden></section>
</main>

<script>
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || `${res.status} ${res.statusText}`);
  return body;
}

const state = { queryId: null, problem: '', matches: [], selectedId: null, guide: null };
const details = {};          // method id -> GET /methods/{id} payload
const fitRated = new Set();  // method ids rated for this query

// The explanation is Markdown prose. Escape first, then allow only bold and
// line breaks back in — nothing the model writes can become markup.
function prose(text) {
  return esc(text)
    .replace(/^#{1,6}\s*/gm, '')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function dots(n) { return '●'.repeat(n) + '○'.repeat(5 - n); }

// "240–1200 minutes" reads badly; past two hours, say hours.
function duration(min, max) {
  if (max < 120) return [`${min}–${max}`, 'minutes'];
  const h = (m) => String(Math.round(m / 6) / 10);
  return [`${h(min)}–${h(max)}`, 'hours'];
}

// Bar width shows each method's fit relative to the others in this answer:
// the sort key (rerank score when a reranker ran, else similarity) mapped onto
// 30–100%. It is never an absolute quality claim; raw values sit in Details.
function widths(matches) {
  const key = (m) => (m.rerank_score ?? m.similarity);
  const vals = matches.map(key);
  const hi = Math.max(...vals), lo = Math.min(...vals);
  return vals.map((v) => (hi === lo ? 100 : Math.round(30 + 70 * (v - lo) / (hi - lo))));
}

function fitWord(i, w) {
  if (i === 0) return 'best match';
  return w >= 75 ? 'close alternative' : 'alternative';
}

function setStatus(html) {
  $('status').innerHTML = html;
  $('status').hidden = !html;
}

function renderResults(data) {
  state.queryId = data.query_id;
  state.matches = data.matches;
  fitRated.clear();
  $('results').hidden = false;
  $('apply').hidden = true;

  $('guidance').innerHTML = data.guidance
    ? `<div class="note" style="margin-bottom:.8rem">${esc(data.guidance)}</div>` : '';

  const w = widths(data.matches);
  $('ranking').innerHTML = data.matches.map((m, i) => `<li>
      <button type="button" class="rank" data-id="${esc(m.id)}">
        <span class="n">${i + 1}</span>
        <span><span class="name">${esc(m.name)}</span><span class="fit">${fitWord(i, w[i])}</span></span>
        <span class="bar"><i style="width:${w[i]}%"></i></span>
      </button></li>`).join('');

  $('raw').innerHTML = `ordered by ${esc(data.ranking_basis)}<br>` + data.matches.map((m) =>
    `${esc(m.id)}: similarity ${m.similarity.toFixed(3)}` +
    (m.rerank_score == null ? '' : ` · rerank ${m.rerank_score.toFixed(2)}`)).join('<br>');

  if (data.explanation) {
    $('why').innerHTML = prose(data.explanation);
  } else if (data.explanation_error) {
    $('why').innerHTML = '<p class="muted">The explanation is unavailable right now — the ranking is complete.</p>';
  } else {
    $('why').innerHTML = '<p class="muted">No explanation for this answer.</p>';
  }
  $('why-card').hidden = data.matches.length === 0;

  if (data.matches.length) {
    selectMethod(data.matches[0].id);
  } else {
    $('method').hidden = true;
  }
}

async function selectMethod(id) {
  state.selectedId = id;
  for (const b of document.querySelectorAll('.rank')) b.classList.toggle('on', b.dataset.id === id);
  const m = state.matches.find((x) => x.id === id);
  $('method').hidden = false;
  $('method').innerHTML = `<h2>${esc(m.name)}</h2><p class="muted">Loading the method…</p>`;
  try {
    details[id] = details[id] || await api(`/methods/${encodeURIComponent(id)}`);
  } catch (e) {
    $('method').innerHTML = `<h2>${esc(m.name)}</h2><div class="note err">${esc(e.message)}</div>`;
    return;
  }
  if (state.selectedId !== id) return;  // the user clicked on while this loaded
  state.guide = details[id].guide;
  renderMethod(details[id]);
}

function renderMethod(d) {
  const g = d.guide;
  const inAnswer = new Set(state.matches.map((m) => m.id));
  const instead = g.see_also.filter((l) => l.method_id).map((l) => {
    const name = inAnswer.has(l.method_id)
      ? `<button type="button" class="link" data-goto="${esc(l.method_id)}">${esc(l.label)}</button>`
      : `<b>${esc(l.label)}</b>`;
    return `<li>${name}${l.note ? ` — ${esc(l.note)}` : ''}</li>`;
  }).join('');

  const [span, unit] = duration(d.duration_min, d.duration_max);
  $('method').innerHTML = `
    <span class="label">Selected method</span>
    <h2>${esc(d.name)}</h2>
    <p class="use">${esc(d.use_case)}</p>
    <div class="tiles">
      <div class="tile"><b>${span}</b><small>${unit}${g.outline_duration ? ` · outline: ${esc(g.outline_duration)}` : ''}</small></div>
      <div class="tile"><b>${dots(d.complexity_score)}</b><small>effort</small></div>
      <div class="tile"><b>${g.steps.length}</b><small>steps</small></div>
    </div>
    <div class="cols">
      <div><span class="label">Strengths</span><ul>${d.strengths.slice(0, 3).map((s) => `<li>${esc(s)}</li>`).join('')}</ul></div>
      <div><span class="label">Not a fit when…</span><ul>${g.not_a_fit_when.map((s) => `<li>${esc(s)}</li>`).join('') || '<li class="muted">Nothing noted.</li>'}</ul></div>
    </div>
    ${instead ? `<span class="label" style="margin-top:1rem">Consider instead</span><ul>${instead}</ul>` : ''}
    <div class="rate" id="fit">${fitRated.has(d.id) ? 'Thanks — noted.' : `Does this fit your problem?
      ${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-fit="${n}" title="${n} of 5">${n}</button>`).join('')}
      <span class="muted">1 = not at all · 5 = exactly</span>`}</div>
    <div class="row" id="method-actions"></div>`;
}

$('ranking').addEventListener('click', (ev) => {
  const b = ev.target.closest('.rank');
  if (b) selectMethod(b.dataset.id);
});

$('method').addEventListener('click', async (ev) => {
  const go = ev.target.closest('[data-goto]');
  if (go) { selectMethod(go.dataset.goto); return; }
  const fit = ev.target.closest('[data-fit]');
  if (!fit) return;
  const id = state.selectedId;
  try {
    await api('/feedback', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        method_id: id, rating: Number(fit.dataset.fit), query_id: state.queryId,
        aspect: 'recommendation',
      }),
    });
    fitRated.add(id);
    $('fit').textContent = 'Thanks — noted.';
  } catch (e) {
    $('fit').innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`;
  }
});

$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const problem = $('problem').value.trim();
  const alreadyDone = $('already-done').value.trim();
  $('go').disabled = true;
  $('results').hidden = true;
  setStatus('<div class="waiting"><div class="pulse"></div>Finding methods for your problem… this can take a few seconds.</div>');
  try {
    const data = await api('/query', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ problem, already_done: alreadyDone || null, top_k: 5, explain: true }),
    });
    state.problem = problem;
    setStatus('');
    renderResults(data);
  } catch (e) {
    setStatus(`<div class="note err">Something went wrong: ${esc(e.message)}</div>`);
  } finally {
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
