name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # -c constraints.txt pins the environment so a dependency release
          # can't turn a green branch red on its own. See constraints.txt.
          pip install -e ".[dev]" -c constraints.txt
      - name: Ruff lint
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts
      - name: Mypy
        run: mypy src/methodos
      - name: Schema drift check
        run: |
          python scripts/regenerate_schema.py --out /tmp/schema_check.json
          diff -u schemas/method_schema.json /tmp/schema_check.json
      - name: Tests
        run: pytest -q
      - name: Integration tests parse-only
        run: |
          # Guards against integration tests that no longer import or collect.
          # They are deselected from `pytest -q` above and can't run here (no
          # API keys, and the `local` extra isn't installed), so collecting
          # them is the strongest check CI can make.
          # The `-eq 5` arm covers pytest's "no tests collected" exit, which
          # only happens if every integration test is removed again — not a
          # failure. Any other non-zero exit (collection error) still fails.
          pytest --collect-only -m integration || [ "$?" -eq 5 ]
