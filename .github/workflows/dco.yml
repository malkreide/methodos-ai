name: dco

# Developer Certificate of Origin: every commit in a pull request from an
# outside contributor must carry `Signed-off-by: Name <email>` matching its
# author (`git commit -s`). That is the contributor certifying they have the
# right to submit the work under the repository's licences — MIT for code,
# CC BY-SA 4.0 for methods/.
#
# Owner, members, collaborators and bots are exempt: their right to submit is
# not in question, and requiring it of Dependabot would fail every bump.

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format='%ae' "$sha")
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qiF "<$email>"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") — missing 'Signed-off-by: ... <$email>'"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Add a sign-off to each commit: git rebase --signoff $BASE && git push --force-with-lease"
            echo "See CONTRIBUTING.md, 'Licensing and sign-off'."
            exit 1
          fi
