version: 2

updates:
  # Keeps constraints.txt current. Without this, pinning would just freeze the
  # project on old dependencies instead of controlling *when* it moves.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR per month for routine bumps; majors stay separate so a breaking
      # release is reviewed on its own.
      dev-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # transformers (the `local` extra) caps tokenizers<=0.23.0, and 0.23.0
      # never shipped as a final — see the note above the pin in
      # constraints.txt. CI never installs the `local` extra and stays green,
      # so without this rule every monthly run proposes 0.23.x and breaks
      # `make install` silently. Remove it once transformers lifts the ceiling.
      - dependency-name: "tokenizers"
        versions: [">=0.23"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
